services:
  # Frontend Application
  laac-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laac-app
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: laac_microservices
      DB_USER: laac_user
      DB_PASSWORD: laac_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - laac-microservices
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MariaDB Database
  mariadb:
    image: mariadb:10.11
    container_name: laac-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: laac_microservices
      MYSQL_USER: laac_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-laac_password}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/microservices-init:/docker-entrypoint-initdb.d
    networks:
      - laac-microservices
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: laac-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - laac-microservices
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Gateway (Orchestrator)
  api-gateway:
    build:
      context: ./microservices/api-gateway
      dockerfile: Dockerfile
    container_name: laac-api-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_SERVICE_URL: http://auth-service:3001
      EVENTS_SERVICE_URL: http://events-service:3002
      MAPS_SERVICE_URL: http://maps-service:3003
      FEED_SERVICE_URL: http://feed-service:3004
      CHAT_SERVICE_URL: http://chat-service:3005
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key}
    ports:
      - "3000:3000"
    networks:
      - laac-microservices
    depends_on:
      - redis
      - auth-service
      - events-service
      - maps-service
      - feed-service
      - chat-service
    
  # Auth Service
  auth-service:
    build:
      context: ./microservices/auth-service
      dockerfile: Dockerfile
    container_name: laac-auth-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: laac_microservices
      DB_USER: laac_user
      DB_PASSWORD: ${MYSQL_PASSWORD:-laac_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key}
      JWT_EXPIRES_IN: 7d
    networks:
      - laac-microservices
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    
  # Events Service
  events-service:
    build:
      context: ./microservices/events-service
      dockerfile: Dockerfile
    container_name: laac-events-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: laac_microservices
      DB_USER: laac_user
      DB_PASSWORD: ${MYSQL_PASSWORD:-laac_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_SERVICE_URL: http://auth-service:3001
    networks:
      - laac-microservices
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    
  # Maps Service
  maps-service:
    build:
      context: ./microservices/maps-service
      dockerfile: Dockerfile
    container_name: laac-maps-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3003
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: laac_microservices
      DB_USER: laac_user
      DB_PASSWORD: ${MYSQL_PASSWORD:-laac_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_SERVICE_URL: http://auth-service:3001
    networks:
      - laac-microservices
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    
  # Feed Service
  feed-service:
    build:
      context: ./microservices/feed-service
      dockerfile: Dockerfile
    container_name: laac-feed-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3004
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: laac_microservices
      DB_USER: laac_user
      DB_PASSWORD: ${MYSQL_PASSWORD:-laac_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_SERVICE_URL: http://auth-service:3001
      EVENTS_SERVICE_URL: http://events-service:3002
    networks:
      - laac-microservices
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      events-service:
        condition: service_healthy
    
  # Chat Service
  chat-service:
    build:
      context: ./microservices/chat-service
      dockerfile: Dockerfile
    container_name: laac-chat-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3005
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: laac_microservices
      DB_USER: laac_user
      DB_PASSWORD: ${MYSQL_PASSWORD:-laac_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_SERVICE_URL: http://auth-service:3001
    networks:
      - laac-microservices
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: laac-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/microservices.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    networks:
      - laac-microservices
    depends_on:
      - api-gateway
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mariadb_data:
    driver: local
  redis_data:
    driver: local

networks:
  laac-microservices:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
