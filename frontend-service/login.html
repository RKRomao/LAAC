<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAAC - Login & Registo</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth.css">
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon16x16.png">
</head>
<body>

    <div class="auth-page">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>

        <div class="auth-container">
            <div class="auth-card glass">
                <div class="auth-header">
                    <h1 id="auth-title">Bem-vindo de volta</h1>
                    <p id="auth-subtitle" class="text-muted">Introduz os teus dados para entrar.</p>
                </div>

                <div class="auth-tabs">
                    <div id="tab-login" class="auth-tab active" onclick="switchTab('login')">Login</div>
                    <div id="tab-register" class="auth-tab" onclick="switchTab('register')">Registo</div>
                </div>

                <form id="auth-form" onsubmit="handleAuth(event)">
                    <div class="form-group">
                        <label>E-mail Académico</label>
                        <input type="email" id="email" class="auth-input" placeholder="exemplo@ubi.pt" autocomplete="username" required>
                    </div>

                    <div class="form-group" style="margin-top: 1rem;">
                        <label>Palavra-passe</label>
                        <input type="password" id="password" class="auth-input" placeholder="••••••••" autocomplete="current-password" required>
                    </div>

                    <div id="register-fields" style="display: none; margin-top: 1rem;">
                        <div class="form-group">
                            <label>Confirmar Palavra-passe</label>
                            <input type="password" id="confirm-password" class="auth-input" placeholder="••••••••" autocomplete="new-password">
                        </div>
                    </div>

                    <button type="submit" class="btn-auth" id="submit-btn">Entrar</button>
                </form>

                <div class="auth-footer">
                    <p id="footer-text">Não tens conta? <a href="#" onclick="switchTab('register')">Cria uma agora</a></p>
                </div>
            </div>
        </div>

        <footer style="margin-top: auto; width: 100%;">
            <div class="logo logo-img"><img src="assets/Logo/Logo_white_text_horizontal.png" alt="LAAC" style="height: 25px;"></div>
            <div class="footer-links">
                <a href="#">Privacidade</a>
                <a href="#">Termos</a>
                <a href="report.html" class="btn-report-bug"><i class="fa-solid fa-bug"></i> Reportar Problema</a>
            </div>
            <p class="text-muted">&copy; 2026 LAAC UBI. Todos os direitos reservados.</p>
        </footer>
    </div>

    <script>
        let currentTab = 'login';

        function switchTab(tab) {
            currentTab = tab;
            const title = document.getElementById('auth-title');
            const subtitle = document.getElementById('auth-subtitle');
            const submitBtn = document.getElementById('submit-btn');
            const footerText = document.getElementById('footer-text');
            const registerFields = document.getElementById('register-fields');
            
            document.getElementById('tab-login').classList.remove('active');
            document.getElementById('tab-register').classList.remove('active');
            document.getElementById(`tab-${tab}`).classList.add('active');

            if (tab === 'login') {
                title.innerText = 'Bem-vindo de volta';
                subtitle.innerText = 'Introduz os teus dados para entrar.';
                submitBtn.innerText = 'Entrar';
                footerText.innerHTML = 'Não tens conta? <a href="#" onclick="switchTab(\'register\')">Cria uma agora</a>';
                registerFields.style.display = 'none';
            } else {
                title.innerText = 'Cria a tua conta';
                subtitle.innerText = 'Junta-te à comunidade LAAC UBI.';
                submitBtn.innerText = 'Registar';
                footerText.innerHTML = 'Já tens conta? <a href="#" onclick="switchTab(\'login\')">Faz login</a>';
                registerFields.style.display = 'block';
            }
        }

        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const endpoint = currentTab === 'login' ? '/api/auth/login' : '/api/auth/register';
            
            if (currentTab === 'register') {
                const confirmPass = document.getElementById('confirm-password').value;
                if (password !== confirmPass) {
                    alert('As palavras-passe não coincidem!');
                    return;
                }
            }

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    if (currentTab === 'login') {
                        localStorage.setItem('laac_token', data.access_token);
                        localStorage.setItem('laac_role', data.role);
                        localStorage.setItem('laac_user_id', data.user_id);
                        localStorage.setItem('laac_user_email', email);
                        alert('Login realizado com sucesso!');
                        if (data.role === 'admin') {
                            window.location.href = 'admin.html';
                        } else if (data.role.includes('Response-team')) {
                            window.location.href = 'responder.html';
                        } else {
                            window.location.href = 'index.html';
                        }
                    } else {
                        alert('Registo concluído! Faz login agora.');
                        switchTab('login');
                    }
                } else {
                    alert('Erro: ' + data.detail);
                }
            } catch (error) {
                alert('Erro na comunicação com o servidor.');
            }
        }
    </script>
    <script src="translate.js" defer></script>
</body>
</html>
